id = "com.example.echo"
name = "Echo Example"
version = "0.1.0"
description = "Yuki Plugin API v2 的无网络 Echo 示例插件"
entrypoint = "echo_plugin:EchoPlugin"

plugin_api = "2.0"
yuki_requires = ">=1.6.0,<4.0"

permissions = [
  "tool.register",
  "command.register",
  "event.subscribe",
  "prompt.context.register",
  "automation.action.register",
  "plugin.config.read",
  "plugin.config.write",
  "storage.private",
]

[limits]
background_tasks = 0
http_concurrency = 1
storage_mb = 10
prompt_characters = 500
