id = "io.github.yuanyeyoutao.netease-music-card"
name = "NetEase Music Card"
version = "0.2.3"
description = "通过只读网易云 MCP 搜索歌曲或专辑，并向当前 QQ 会话发送原生音乐卡片"
entrypoint = "netease_music_card_plugin:NetEaseMusicCardPlugin"

plugin_api = "2.0"
yuki_requires = ">=2.1.1,<4.0"

permissions = [
  "message.current.read",
  "tool.register",
  "mcp.call",
  "onebot.send",
]

[limits]
background_tasks = 0
http_concurrency = 1
storage_mb = 10
prompt_characters = 0
