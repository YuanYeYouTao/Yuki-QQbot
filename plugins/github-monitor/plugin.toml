id = "github-monitor"
name = "GitHub Monitor"
version = "1.1.0"
description = "Monitor GitHub repositories and publish events into Yuki conversations."
entrypoint = "github_monitor:GitHubMonitorPlugin"

plugin_api = "2.0"
yuki_requires = ">=3.4.1,<4.0"

permissions = [
  "background.worker",
  "network.http.allowlisted",
  "storage.private",
  "plugin.config.read",
  "plugin.config.write",
  "command.register",
  "notification.publish",
  "notification.agent",
  "media.artifact.create",
]

secrets = ["GITHUB_TOKEN"]

[network]
allowed_hosts = ["api.github.com"]

[limits]
background_tasks = 1
http_concurrency = 4
storage_mb = 100
prompt_characters = 0
