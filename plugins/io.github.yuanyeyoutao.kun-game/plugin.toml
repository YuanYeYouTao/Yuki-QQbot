id = "io.github.yuanyeyoutao.kun-game"
name = "Kun Game"
version = "1.0.0"
description = "养鲲、对战、BOSS、拍卖与群小游戏的确定性 QQ 群游戏插件"
entrypoint = "plugin:KunGamePlugin"

plugin_api = "2.0"
yuki_requires = ">=3.1.0,<4.0"

permissions = [
  "command.register",
  "message.current.read",
  "person.current.read",
  "storage.private",
  "plugin.config.read",
  "plugin.config.write",
]

[limits]
background_tasks = 0
http_concurrency = 1
storage_mb = 32
prompt_characters = 0
