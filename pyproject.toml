[project]
name = "qq-ai-bot"
version = "3.6.0"
description = "基于 NoneBot2、OneBot v11 与 NapCatQQ 的个人 QQ AI 聊天机器人"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "mcp>=1.28,<2",
    "nonebot-adapter-onebot>=2.4,<3",
    "nonebot2[fastapi]>=2.4,<3",
    "packaging>=24,<27",
    "pillow>=11,<13",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<3",
    "tenacity>=9,<10",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "types-jsonschema>=4.23,<5",
]

[project.scripts]
qq-ai-bot = "qq_ai_bot.main:run"
qq-ai-bot-cli = "qq_ai_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qq_ai_bot", "src/yuki_plugin_sdk"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["qq_ai_bot", "yuki_plugin_sdk"]
mypy_path = "src"
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nonebot.*", "nonebot_adapter_onebot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "qwen_embedding_integration: opt-in test against the real DashScope embedding API",
]

[tool.nonebot]
plugins = []
plugin_dirs = ["src/qq_ai_bot/plugins"]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]
